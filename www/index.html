<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#fff7f3">
<title>손전등</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<!-- 위장 잠금 화면 -->
<section id="gate" class="screen">
  <div class="gate-box">
    <div class="gate-icon">🔦</div>
    <h1>랜턴을 켜시겠습니까?</h1>
    <input id="gate-pw" type="password" inputmode="numeric" pattern="[0-9]*" maxlength="8" autocomplete="off">
    <button id="gate-on" class="gate-btn">켜기</button>
  </div>
</section>
<div id="light" class="light hidden"><p>화면을 누르면 꺼집니다</p></div>

<!-- 로그인 -->
<section id="login" class="screen hidden">
  <div class="login-box">
    <h1 class="room-title">백조의 방</h1>
    <div style="height:10px"></div>
    <input id="login-email" type="email" placeholder="이메일" autocomplete="username">
    <input id="login-pw" type="password" placeholder="비밀번호" autocomplete="current-password">
    <button id="login-btn" class="btn primary">들어가기</button>
    <p id="login-err" class="err"></p>
  </div>
</section>

<!-- 이름 정하기 -->
<section id="whoami" class="screen hidden">
  <div class="login-box">
    <div class="logo">🙋</div>
    <h1>누구세요?</h1>
    <p class="sub">이 폰을 쓰는 사람 이름을 적어주세요</p>
    <input id="me-name" type="text" maxlength="10" placeholder="예: 지민">
    <button id="me-save" class="btn primary">시작하기</button>
  </div>
</section>

<!-- 메인 -->
<section id="main" class="screen hidden">
  <header class="top">
    <h2 id="title">캘린더</h2>
    <button id="settings-btn" class="icon-btn" aria-label="설정">⚙️</button>
  </header>

  <!-- 캘린더 -->
  <div id="tab-cal" class="tab">
    <div class="cal-head">
      <button id="cal-prev" class="icon-btn">‹</button>
      <div id="cal-month"></div>
      <button id="cal-next" class="icon-btn">›</button>
    </div>
    <div class="cal-week"><span>일</span><span>월</span><span>화</span><span>수</span><span>목</span><span>금</span><span>토</span></div>
    <div id="cal-grid" class="cal-grid"></div>
    <div class="day-panel">
      <div class="day-head">
        <div id="day-title"></div>
        <div class="row">
          <label class="btn small" aria-label="사진 찍기">📷<input id="day-camera" type="file" accept="image/*" capture="environment" hidden></label>
          <label class="btn small" aria-label="갤러리">🖼️<input id="day-photo-file" type="file" accept="image/*" multiple hidden></label>
          <button id="add-event" class="btn small primary">+ 일정</button>
        </div>
      </div>
      <div id="day-events"></div>
      <div id="day-photos" class="thumbs"></div>
    </div>
  </div>

  <!-- 노트 -->
  <div id="tab-notes" class="tab hidden">
    <div id="chat" class="chat"></div>
    <div id="chat-preview" class="chat-preview hidden">
      <img id="chat-preview-img" alt="">
      <button id="chat-preview-x" class="icon-btn">✕</button>
    </div>
    <div class="chat-input">
      <label class="icon-btn attach">📷<input id="chat-camera" type="file" accept="image/*" capture="environment" hidden></label>
      <label class="icon-btn attach">🖼️<input id="chat-file" type="file" accept="image/*" hidden></label>
      <textarea id="chat-text" rows="1" placeholder="메시지 남기기"></textarea>
      <button id="chat-send" class="btn primary small">보내기</button>
    </div>
  </div>

  <!-- 채팅 (매일 자정 삭제) -->
  <div id="tab-chat" class="tab hidden">
    <div class="chat-banner">🌙 오늘 대화는 자정(00:00)에 모두 사라져요</div>
    <div id="talk" class="chat"></div>
    <div class="chat-input">
      <textarea id="talk-text" rows="1" placeholder="메시지 보내기"></textarea>
      <button id="talk-send" class="btn primary small">보내기</button>
    </div>
  </div>

  <!-- 사진 -->
  <div id="tab-photos" class="tab hidden">
    <div id="album"></div>
    <label class="fab fab-cam">📷<input id="photo-camera" type="file" accept="image/*" capture="environment" hidden></label>
    <label class="fab">＋<input id="photo-file" type="file" accept="image/*" multiple hidden></label>
  </div>

  <nav class="bottom">
    <button data-tab="cal" class="active"><span>📅</span>캘린더</button>
    <button data-tab="notes"><span>📝</span>노트</button>
    <button data-tab="chat"><span>💬</span>채팅</button>
    <button data-tab="photos"><span>🖼️</span>사진</button>
  </nav>
</section>

<!-- 시트(모달) -->
<div id="sheet-bg" class="sheet-bg hidden"></div>

<div id="sheet-event" class="sheet hidden">
  <h3>일정 추가</h3>
  <input id="ev-title" type="text" placeholder="무엇을 하나요?" maxlength="60">
  <div class="row">
    <input id="ev-date" type="date">
    <input id="ev-time" type="time">
  </div>
  <textarea id="ev-memo" rows="3" placeholder="메모 (선택)"></textarea>
  <div class="row">
    <button class="btn" data-close>취소</button>
    <button id="ev-save" class="btn primary">저장</button>
  </div>
</div>

<div id="sheet-event-view" class="sheet hidden">
  <h3 id="evv-title"></h3>
  <p id="evv-when" class="muted"></p>
  <p id="evv-memo" class="memo"></p>
  <p id="evv-author" class="muted small"></p>
  <div class="row">
    <button id="evv-del" class="btn danger">삭제</button>
    <button class="btn primary" data-close>닫기</button>
  </div>
</div>

<div id="sheet-photo" class="sheet hidden">
  <h3>사진 올리기</h3>
  <div id="ph-previews" class="thumbs"></div>
  <input id="ph-date" type="date">
  <input id="ph-caption" type="text" placeholder="한 줄 기록 (선택)" maxlength="100">
  <div class="row">
    <button class="btn" data-close>취소</button>
    <button id="ph-save" class="btn primary">올리기</button>
  </div>
</div>

<div id="sheet-settings" class="sheet hidden">
  <h3>설정</h3>
  <label class="muted small">내 이름</label>
  <input id="set-name" type="text" maxlength="10">
  <button id="set-save" class="btn primary">이름 저장</button>
  <button id="set-logout" class="btn">로그아웃</button>
  <button class="btn" data-close>닫기</button>
</div>

<!-- 사진 크게 보기 -->
<div id="viewer" class="viewer hidden">
  <img id="viewer-img" alt="">
  <div class="viewer-info">
    <div id="viewer-cap"></div>
    <div id="viewer-meta" class="small"></div>
  </div>
  <div class="viewer-btns">
    <button id="viewer-del" class="btn danger small">삭제</button>
    <button id="viewer-close" class="btn small">닫기</button>
  </div>
</div>

<div id="toast" class="toast hidden"></div>
<div id="busy" class="busy hidden"><div class="spinner"></div></div>

<script src="config.js"></script>
<script src="app.js"></script>
</body>
</html>
