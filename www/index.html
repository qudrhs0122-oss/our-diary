<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#fff7f3">
<title>손전등</title>
<link rel="stylesheet" href="lib/leaflet.css">
<link rel="stylesheet" href="style.css">
</head>
<body>

<!-- 위장 잠금 화면 -->
<section id="gate" class="screen">
  <div class="gate-box">
    <div class="gate-icon">🔦</div>
    <h1>랜턴을 켜시겠습니까?</h1>
    <input id="gate-pw" type="password" inputmode="numeric" pattern="[0-9]*" maxlength="8" autocomplete="off">
    <button id="gate-on" class="gate-btn">켜기</button>
  </div>
</section>
<div id="light" class="light hidden"><p>화면을 누르면 꺼집니다</p></div>

<!-- 로그인 -->
<section id="login" class="screen hidden">
  <div class="login-box">
    <h1 class="room-title">백조의 방</h1>
    <div style="height:10px"></div>
    <input id="login-email" type="email" placeholder="이메일" autocomplete="username">
    <input id="login-pw" type="password" placeholder="비밀번호" autocomplete="current-password">
    <button id="login-btn" class="btn primary">들어가기</button>
    <p id="login-err" class="err"></p>
  </div>
</section>

<!-- 이름 정하기 -->
<section id="whoami" class="screen hidden">
  <div class="login-box">
    <div class="logo">🙋</div>
    <h1>누구세요?</h1>
    <p class="sub">이 폰을 쓰는 사람 이름을 적어주세요</p>
    <input id="me-name" type="text" maxlength="10" placeholder="예: 지민">
    <button id="me-save" class="btn primary">시작하기</button>
  </div>
</section>

<!-- 메인 -->
<section id="main" class="screen hidden">
  <header class="top">
    <h2 id="title">캘린더</h2>
    <div id="presence" class="presence"></div>
    <button id="settings-btn" class="icon-btn" aria-label="설정">⚙️</button>
  </header>

  <!-- 캘린더 -->
  <div id="tab-cal" class="tab">
    <div id="dday" class="dday">
      <div class="dday-top"><span>💗 함께한 시간</span><span id="dday-count" class="dday-d"></span></div>
      <div id="dday-time" class="dday-time"></div>
      <div id="dday-next" class="dday-next"></div>
      <div id="dday-list" class="dday-list hidden"></div>
    </div>
    <div class="cal-head">
      <button id="cal-prev" class="icon-btn">‹</button>
      <div id="cal-month"></div>
      <button id="cal-next" class="icon-btn">›</button>
    </div>
    <div class="cal-week"><span>일</span><span>월</span><span>화</span><span>수</span><span>목</span><span>금</span><span>토</span></div>
    <div id="cal-grid" class="cal-grid"></div>
    <div class="day-panel">
      <div class="day-head">
        <div id="day-title"></div>
        <div class="row">
          <label class="btn small" aria-label="사진 찍기">📷<input id="day-camera" type="file" accept="image/*" capture="environment" hidden></label>
          <label class="btn small" aria-label="갤러리">🖼️<input id="day-photo-file" type="file" accept="image/*" multiple hidden></label>
          <button id="add-event" class="btn small primary">+ 일정</button>
        </div>
      </div>
      <div id="day-events"></div>
      <div id="day-photos" class="thumbs"></div>
    </div>
  </div>

  <!-- 노트 -->
  <div id="tab-notes" class="tab hidden">
    <div id="chat" class="chat"></div>
    <div id="chat-preview" class="chat-preview hidden">
      <img id="chat-preview-img" alt="">
      <button id="chat-preview-x" class="icon-btn">✕</button>
    </div>
    <div class="chat-input">
      <label class="icon-btn attach">📷<input id="chat-camera" type="file" accept="image/*" capture="environment" hidden></label>
      <label class="icon-btn attach">🖼️<input id="chat-file" type="file" accept="image/*" hidden></label>
      <textarea id="chat-text" rows="1" placeholder="메시지 남기기"></textarea>
      <button id="chat-send" class="btn primary small">보내기</button>
    </div>
  </div>

  <!-- 채팅 (매일 자정 삭제) -->
  <div id="tab-chat" class="tab hidden">
    <div class="chat-banner">🌙 오늘 대화는 자정(00:00)에 모두 사라져요</div>
    <div id="talk" class="chat"></div>
    <div class="chat-input">
      <textarea id="talk-text" rows="1" placeholder="메시지 보내기"></textarea>
      <button id="talk-send" class="btn primary small">보내기</button>
    </div>
  </div>

  <!-- 지도 -->
  <div id="tab-map" class="tab hidden">
    <div id="map"></div>
    <div class="map-search">
      <input id="map-q" type="search" placeholder="장소 검색 (예: 성수동 카페)">
      <button id="map-list-btn" class="map-chip">목록</button>
    </div>
    <div id="map-results" class="map-results hidden"></div>
    <div id="map-cross" class="map-cross hidden">📍</div>
    <div id="map-pickbar" class="map-pickbar hidden">
      <span>지도를 움직여 핀을 맞춰주세요</span>
      <div class="row"><button id="pick-cancel" class="btn small">취소</button><button id="pick-ok" class="btn primary small">여기로 정하기</button></div>
    </div>
    <button id="map-locate" class="map-fab small-fab" aria-label="내 위치">🎯</button>
    <button id="map-add" class="map-fab" aria-label="장소 추가">＋</button>
    <div id="place-list" class="place-list hidden"></div>
  </div>

  <!-- 하트 -->
  <div id="tab-heart" class="tab hidden">
    <div class="heart-total">우리 하트 <b id="ht-total">0</b>번</div>
    <div class="couple">
      <div class="side" data-side="m">
        <div class="count"><b id="ht-m">0</b><span id="ht-m-name">남자</span></div>
        <button class="figure" data-side="m" aria-label="남자 하트">
          <svg viewBox="0 0 160 300" class="person">
          <rect x="22" y="128" width="20" height="92" rx="10" fill="#f2c8a8"/>
          <rect x="118" y="128" width="20" height="92" rx="10" fill="#f2c8a8"/>
          <rect x="22" y="112" width="22" height="64" rx="11" fill="#5b8fd6"/>
          <rect x="116" y="112" width="22" height="64" rx="11" fill="#5b8fd6"/>
          <rect x="56" y="214" width="20" height="74" rx="9" fill="#3d4a66"/>
          <rect x="84" y="214" width="20" height="74" rx="9" fill="#3d4a66"/>
          <rect x="38" y="100" width="84" height="122" rx="26" fill="#6fa8e8"/>
          <rect x="70" y="86" width="20" height="20" fill="#f2c8a8"/>
          <circle cx="80" cy="56" r="38" fill="#f6d2b4"/>
          <path d="M42,52 C42,22 62,14 80,14 C102,14 120,24 118,52 C112,40 102,34 92,36 C80,30 60,36 42,52 Z" fill="#3a2b26"/>
          <circle cx="66" cy="60" r="4" fill="#3a2b26"/><circle cx="94" cy="60" r="4" fill="#3a2b26"/>
          <path d="M70,76 Q80,84 90,76" stroke="#c9735f" stroke-width="3" fill="none" stroke-linecap="round"/>
          <circle cx="58" cy="72" r="6" fill="#ffb3a8" opacity=".6"/><circle cx="102" cy="72" r="6" fill="#ffb3a8" opacity=".6"/>
          <g class="heart" transform="translate(80,150)"><path d="M0,-6 C-4,-14 -16,-12 -16,-2 C-16,6 -6,12 0,18 C6,12 16,6 16,-2 C16,-12 4,-14 0,-6 Z" transform="scale(1.6)"/></g>
        </svg>
        </button>
      </div>
      <div class="side" data-side="f">
        <div class="count"><b id="ht-f">0</b><span id="ht-f-name">여자</span></div>
        <button class="figure" data-side="f" aria-label="여자 하트">
          <svg viewBox="0 0 160 300" class="person">
          <path d="M38,40 C30,90 34,130 46,150 L114,150 C126,130 130,90 122,40 Z" fill="#5a3a30"/>
          <rect x="24" y="126" width="20" height="90" rx="10" fill="#f6d2b4"/>
          <rect x="116" y="126" width="20" height="90" rx="10" fill="#f6d2b4"/>
          <rect x="24" y="112" width="22" height="46" rx="11" fill="#ff8fa3"/>
          <rect x="114" y="112" width="22" height="46" rx="11" fill="#ff8fa3"/>
          <rect x="60" y="226" width="16" height="62" rx="8" fill="#f6d2b4"/>
          <rect x="84" y="226" width="16" height="62" rx="8" fill="#f6d2b4"/>
          <path d="M50,104 C50,100 110,100 110,104 L132,236 C132,240 28,240 28,236 Z" fill="#ff9eb1"/>
          <rect x="71" y="88" width="18" height="18" fill="#f6d2b4"/>
          <circle cx="80" cy="58" r="36" fill="#f9dcc4"/>
          <path d="M42,62 C38,24 60,16 80,16 C104,16 124,28 118,64 C112,46 100,36 80,38 C64,38 50,46 42,62 Z" fill="#5a3a30"/>
          <circle cx="67" cy="62" r="4" fill="#3a2b26"/><circle cx="93" cy="62" r="4" fill="#3a2b26"/>
          <path d="M71,77 Q80,85 89,77" stroke="#d0606a" stroke-width="3" fill="none" stroke-linecap="round"/>
          <circle cx="59" cy="73" r="6" fill="#ff9aa8" opacity=".6"/><circle cx="101" cy="73" r="6" fill="#ff9aa8" opacity=".6"/>
          <g class="heart" transform="translate(80,150)"><path d="M0,-6 C-4,-14 -16,-12 -16,-2 C-16,6 -6,12 0,18 C6,12 16,6 16,-2 C16,-12 4,-14 0,-6 Z" transform="scale(1.6)"/></g>
        </svg>
        </button>
      </div>
    </div>
    <p class="heart-hint">가슴의 하트를 눌러주세요 💗</p>
    <div id="floaters"></div>
  </div>

  <!-- 버킷리스트 -->
  <div id="tab-bucket" class="tab hidden">
    <div class="bucket-add">
      <input id="bk-text" type="text" maxlength="80" placeholder="함께 하고 싶은 것 적기">
      <button id="bk-add" class="btn primary small">추가</button>
    </div>
    <div class="bucket-filter">
      <button data-f="todo" class="on">하고 싶은 것</button>
      <button data-f="done">이룬 것</button>
      <button data-f="all">전체</button>
      <span id="bk-progress"></span>
    </div>
    <div id="bucket"></div>
  </div>

  <!-- 사진 -->
  <div id="tab-photos" class="tab hidden">
    <div id="album"></div>
    <label class="fab fab-cam">📷<input id="photo-camera" type="file" accept="image/*" capture="environment" hidden></label>
    <label class="fab">＋<input id="photo-file" type="file" accept="image/*" multiple hidden></label>
  </div>

  <nav class="bottom">
    <button data-tab="cal" class="active"><span>📅</span>캘린더</button>
    <button data-tab="notes"><span>📝</span>노트</button>
    <button data-tab="chat"><span>💬</span>채팅</button>
    <button data-tab="photos"><span>🖼️</span>사진</button>
    <button data-tab="map"><span>🗺️</span>지도</button>
    <button data-tab="bucket"><span>✅</span>버킷</button>
    <button data-tab="heart"><span>💗</span>하트</button>
  </nav>
</section>

<!-- 시트(모달) -->
<div id="sheet-bg" class="sheet-bg hidden"></div>

<div id="sheet-event" class="sheet hidden">
  <h3>일정 추가</h3>
  <input id="ev-title" type="text" placeholder="무엇을 하나요?" maxlength="60">
  <div class="row">
    <input id="ev-date" type="date">
    <input id="ev-time" type="time">
  </div>
  <textarea id="ev-memo" rows="3" placeholder="메모 (선택)"></textarea>
  <div class="row">
    <button class="btn" data-close>취소</button>
    <button id="ev-save" class="btn primary">저장</button>
  </div>
</div>

<div id="sheet-event-view" class="sheet hidden">
  <h3 id="evv-title"></h3>
  <p id="evv-when" class="muted"></p>
  <p id="evv-memo" class="memo"></p>
  <p id="evv-author" class="muted small"></p>
  <div class="row">
    <button id="evv-del" class="btn danger">삭제</button>
    <button class="btn primary" data-close>닫기</button>
  </div>
</div>

<div id="sheet-photo" class="sheet hidden">
  <h3>사진 올리기</h3>
  <div id="ph-previews" class="thumbs"></div>
  <input id="ph-date" type="date">
  <input id="ph-caption" type="text" placeholder="한 줄 기록 (선택)" maxlength="100">
  <div class="row">
    <button class="btn" data-close>취소</button>
    <button id="ph-save" class="btn primary">올리기</button>
  </div>
</div>

<div id="sheet-place" class="sheet hidden">
  <h3>갔던 곳 기록하기</h3>
  <input id="pl-name" type="text" maxlength="40" placeholder="장소 이름">
  <p id="pl-addr" class="muted small"></p>
  <input id="pl-date" type="date">
  <textarea id="pl-memo" rows="3" placeholder="어땠는지 남겨보세요"></textarea>
  <div id="pl-previews" class="thumbs"></div>
  <div class="row">
    <label class="btn">📷 찍기<input id="pl-camera" type="file" accept="image/*" capture="environment" hidden></label>
    <label class="btn">🖼️ 사진 추가<input id="pl-files" type="file" accept="image/*" multiple hidden></label>
  </div>
  <div class="row">
    <button class="btn" data-close>취소</button>
    <button id="pl-save" class="btn primary">저장</button>
  </div>
</div>

<div id="sheet-place-view" class="sheet hidden">
  <h3 id="pv-name"></h3>
  <p id="pv-when" class="muted small"></p>
  <p id="pv-memo" class="memo"></p>
  <div id="pv-photos" class="thumbs"></div>
  <div class="row">
    <label class="btn small">📷<input id="pv-camera" type="file" accept="image/*" capture="environment" hidden></label>
    <label class="btn small">🖼️ 사진 더하기<input id="pv-files" type="file" accept="image/*" multiple hidden></label>
    <button id="pv-del" class="btn small danger">삭제</button>
    <button class="btn small primary" data-close style="margin-left:auto">닫기</button>
  </div>
</div>

<div id="sheet-side" class="sheet hidden">
  <h3>나는 어느 쪽인가요?</h3>
  <p class="muted small">한 번만 정하면 돼요. 나중에 설정(⚙️)에서 바꿀 수 있어요.</p>
  <div class="row">
    <button class="btn side-pick" data-side="m">👦 왼쪽 (남자)</button>
    <button class="btn side-pick" data-side="f">👧 오른쪽 (여자)</button>
  </div>
</div>

<div id="sheet-settings" class="sheet hidden">
  <h3>설정</h3>
  <label class="muted small">내 이름</label>
  <input id="set-name" type="text" maxlength="10">
  <button id="set-save" class="btn primary">이름 저장</button>
  <label class="muted small">하트 페이지에서 나는</label>
  <div class="row">
    <button class="btn side-pick" data-side="m">👦 왼쪽 (남자)</button>
    <button class="btn side-pick" data-side="f">👧 오른쪽 (여자)</button>
  </div>
  <button id="set-logout" class="btn">로그아웃</button>
  <button class="btn" data-close>닫기</button>
</div>

<!-- 사진 크게 보기 -->
<div id="viewer" class="viewer hidden">
  <img id="viewer-img" alt="">
  <div class="viewer-info">
    <div id="viewer-cap"></div>
    <div id="viewer-meta" class="small"></div>
  </div>
  <div class="viewer-btns">
    <button id="viewer-del" class="btn danger small">삭제</button>
    <button id="viewer-close" class="btn small">닫기</button>
  </div>
</div>

<div id="toast" class="toast hidden"></div>
<div id="busy" class="busy hidden"><div class="spinner"></div></div>

<script src="lib/leaflet.js"></script>
<script src="config.js"></script>
<script src="app.js"></script>
</body>
</html>
