name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-apk
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install
        run: |
          set -o pipefail
          npm install --no-audit --no-fund 2>&1 | tee -a build.log

      - name: Create Android project
        run: |
          set -o pipefail
          npx cap add android 2>&1 | tee -a build.log
          npx cap sync android 2>&1 | tee -a build.log

      - name: App icon + signing key
        run: |
          RES=android/app/src/main/res
          # 지도 '내 위치'용 위치 권한
          sed -i 's#</manifest>#    <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" />\n    <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />\n</manifest>#' android/app/src/main/AndroidManifest.xml
          grep -n "LOCATION" android/app/src/main/AndroidManifest.xml
          rm -rf $RES/mipmap-anydpi-v26
          for d in mdpi hdpi xhdpi xxhdpi xxxhdpi; do
            cp icons/$d.png $RES/mipmap-$d/ic_launcher.png
            cp icons/$d.png $RES/mipmap-$d/ic_launcher_foreground.png
            cp icons/${d}_round.png $RES/mipmap-$d/ic_launcher_round.png
          done
          # 항상 같은 서명키로 서명 (업데이트 설치가 되도록)
          cat >> android/app/build.gradle <<'GRADLE'

          android {
              signingConfigs {
                  debug {
            storeFile file("${rootDir}/../signing/debug.keystore")
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
                  }
              }
          }
          GRADLE

      - name: Build APK
        run: |
          set -o pipefail
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace 2>&1 | tee -a ../build.log

      - name: Publish APK to 'apk' branch
        run: |
          mkdir out
          cp android/app/build/outputs/apk/debug/app-debug.apk out/our-diary.apk
          echo "${GITHUB_SHA}" > out/commit.txt
          cd out
          git init -q
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git checkout -q -b apk
          git add .
          git commit -q -m "APK for ${GITHUB_SHA}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" apk

      - uses: actions/upload-artifact@v4
        with:
          name: our-diary-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk

      - name: Save build log on failure
        if: failure()
        run: |
          mkdir logout
          tail -c 200000 build.log > logout/build.log || echo "no log" > logout/build.log
          echo "${GITHUB_SHA}" > logout/commit.txt
          cd logout
          git init -q
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git checkout -q -b build-log
          git add .
          git commit -q -m "build log for ${GITHUB_SHA}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" build-log
